name: Sync job postings

on:
  schedule:
    # Every morning at 08:00 UTC so there are fresh postings each day. The
    # free sources (Greenhouse, Lever, Ashby) cost nothing; the paid Apify
    # source is capped per run so a month of daily runs stays under budget
    # (lib/sources/budget.ts, docs/budget.md).
    - cron: "0 8 * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run sync-jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GREENHOUSE_DEFAULT_BOARDS: ${{ vars.GREENHOUSE_DEFAULT_BOARDS }}
          LEVER_DEFAULT_BOARDS: ${{ vars.LEVER_DEFAULT_BOARDS }}
          ASHBY_DEFAULT_BOARDS: ${{ vars.ASHBY_DEFAULT_BOARDS }}
          CANADA_ONLY: ${{ vars.CANADA_ONLY }}
          SEED_CANADIAN_BOARDS: ${{ vars.SEED_CANADIAN_BOARDS }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_BOARDS_ACTOR: ${{ vars.APIFY_BOARDS_ACTOR }}
          APIFY_BOARD_PLATFORMS: ${{ vars.APIFY_BOARD_PLATFORMS }}
          APIFY_COUNTRY: ${{ vars.APIFY_COUNTRY }}
          APIFY_MONTHLY_BUDGET_USD: ${{ vars.APIFY_MONTHLY_BUDGET_USD }}
          APIFY_RUNS_PER_MONTH: ${{ vars.APIFY_RUNS_PER_MONTH }}
          APIFY_START_PRICE_USD: ${{ vars.APIFY_START_PRICE_USD }}
          APIFY_RESULT_PRICE_USD: ${{ vars.APIFY_RESULT_PRICE_USD }}
