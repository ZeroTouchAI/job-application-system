name: Version bump check

# Every change must bump the version in package.json and add a CHANGELOG entry.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump
        run: |
          base=$(git show "origin/${{ github.base_ref }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          head=$(node -p "require('./package.json').version")
          echo "base=$base head=$head"
          if [ "$base" = "$head" ]; then
            echo "::error::Bump the version in package.json for every change."
            exit 1
          fi
          if ! grep -q "^## \[$head\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $head."
            exit 1
          fi
